[pytest]
testpaths = tests
asyncio_mode = auto
log_cli = true
log_cli_level = WARNING

# Coverage
addopts = -v --tb=short

# Markers
markers =
    unit: Unit tests (no DB, no HTTP)
    integration: Integration tests (DB required)
    e2e: End-to-end tests (full HTTP stack)
    compliance: Compliance-specific tests