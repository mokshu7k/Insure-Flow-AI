# =============================================================================
# InsureFlow AI — GCP Cloud Build CI/CD Pipeline
#
# Triggered on push to 'main' branch.
# Set these substitutions in your Cloud Build trigger:
#   _REGION         e.g. us-central1
#   _SERVICE        e.g. insureflow-backend
#   _REGISTRY       e.g. us-central1-docker.pkg.dev/YOUR_PROJECT/insureflow
# =============================================================================

substitutions:
  _REGION: asia-south1
  _SERVICE: insureflow-backend
  _REGISTRY: asia-south1-docker.pkg.dev/${PROJECT_ID}/insureflow

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8      # faster builds (opencv wheel compile)

steps:
  # ── 1. Build the image ─────────────────────────────────────────────────────
  - name: "gcr.io/cloud-builders/docker"
    id: build
    args:
      - build
      - --cache-from
      - "${_REGISTRY}/${_SERVICE}:latest"
      - --tag
      - "${_REGISTRY}/${_SERVICE}:${SHORT_SHA}"
      - --tag
      - "${_REGISTRY}/${_SERVICE}:latest"
      - --file
      - Dockerfile
      - .

  # ── 2. Push all tags ───────────────────────────────────────────────────────
  - name: "gcr.io/cloud-builders/docker"
    id: push
    waitFor: [build]
    args:
      - push
      - --all-tags
      - "${_REGISTRY}/${_SERVICE}"

  # ── 3. Deploy to Cloud Run ─────────────────────────────────────────────────
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk:slim"
    id: deploy
    waitFor: [push]
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=${_REGISTRY}/${_SERVICE}:${SHORT_SHA}
      - --region=${_REGION}
      - --platform=managed
      - --allow-unauthenticated         # remove if you want IAP / auth proxy
      - --port=8080
      - --memory=2Gi
      - --cpu=2
      - --min-instances=0              # scale to zero when idle
      - --max-instances=10
      - --concurrency=80
      - --timeout=60
      - --set-secrets=SECRET_KEY=insureflow-secret-key:latest,ENCRYPTION_KEY=insureflow-encryption-key:latest,QR_SECRET_KEY=insureflow-qr-secret-key:latest,DATABASE_URL=insureflow-database-url:latest,GCP_API_KEY=insureflow-gcp-api-key:latest
      - --set-env-vars=ALLOWED_ORIGINS=https://YOUR_FRONTEND_DOMAIN,COOKIE_SECURE=true,LOG_LEVEL=info,GOOGLE_CLOUD_PROJECT=techfiesta-487920,GCS_BUCKET_NAME=techfiesta-487920-documents

images:
  - "${_REGISTRY}/${_SERVICE}:${SHORT_SHA}"
  - "${_REGISTRY}/${_SERVICE}:latest"
